[project]
name = "posture-tracker"
version = "0.1.0"
description = "Local webcam posture tracking with a synchronous pose pipeline."
requires-python = ">=3.12"
dependencies = [
    "mediapipe>=0.10.30,<0.11",
    "numpy>=1.26,<3",
    "opencv-contrib-python>=4.11,<5",
]

[dependency-groups]
dev = [
    "pre-commit>=4,<5",
    "pytest>=8,<10",
    "ruff>=0.17.3,<0.18",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
